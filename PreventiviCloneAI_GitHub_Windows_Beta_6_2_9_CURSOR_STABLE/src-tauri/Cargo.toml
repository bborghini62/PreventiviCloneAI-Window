[package]
name = "preventivi-clone-ai"
version = "1.0.0-beta.6.2.6"
description = "Preventivi Clone AI per macOS e Windows"
authors = ["Preventivi Clone AI"]
edition = "2021"

[lib]
name = "preventivi_clone_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSPrintInfo"] }

